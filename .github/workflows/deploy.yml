name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build site in Docker
        run: |
          docker build --target ci -t portfolio:ci .
          mkdir -p dist
          docker run --rm -v "$PWD/dist:/app/dist" portfolio:ci

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: actions/checkout@v7

      - name: Sync custom domain DNS
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: is-cool-me/dnscontrol-action@v4.34.0
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          args: push
          config_file: dns/dnsconfig.js
          creds_file: dns/creds.json

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
