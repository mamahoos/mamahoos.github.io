name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build site in Docker
        run: |
          docker build --target ci -t portfolio:ci .
          mkdir -p dist
          docker run --rm -v "$PWD/dist:/app/dist" portfolio:ci

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Upsert Cloudflare A records for GitHub Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set; skipping DNS upsert"
            exit 0
          fi

          cf() {
            curl -sS --fail-with-body \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "$@"
          }

          zone_json=$(cf "https://api.cloudflare.com/client/v4/zones?name=mamahoos.ir")
          zone_id=$(printf '%s' "${zone_json}" | jq -r '.result[0].id // empty')
          if [ -z "${zone_id}" ] || [ "${zone_id}" = "null" ]; then
            echo "Could not find Cloudflare zone mamahoos.ir"
            printf '%s\n' "${zone_json}"
            exit 1
          fi

          records_url="https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?name=portfolio.mamahoos.ir"
          records_json=$(cf "${records_url}")
          printf '%s' "${records_json}" | jq -r '.result[] | select(.type=="CNAME") | .id' | while read -r cname_id; do
            [ -z "${cname_id}" ] && continue
            cf -X DELETE "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records/${cname_id}" \
              | jq '{success, errors, deleted: .result.id}'
          done

          records_json=$(cf "${records_url}")
          existing_a=$(printf '%s' "${records_json}" | jq -r '.result[] | select(.type=="A") | .content')

          for ip in 185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153; do
            if printf '%s\n' "${existing_a}" | grep -qx "${ip}"; then
              echo "A ${ip} already present"
              continue
            fi
            payload=$(jq -n --arg ip "${ip}" '{type:"A",name:"portfolio",content:$ip,proxied:false,ttl:1}')
            cf -X POST --data "${payload}" \
              "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records" \
              | jq '{success, errors, result: (.result | {id, name, type, content, proxied})}'
          done

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
