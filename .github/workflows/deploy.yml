name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build site in Docker
        run: |
          docker build --target ci -t portfolio:ci .
          mkdir -p dist
          docker run --rm -v "$PWD/dist:/app/dist" portfolio:ci

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Point Pages at the custom domain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT "repos/${{ github.repository }}/pages" \
            --field cname='portfolio.mamahoos.ir' \
            --field build_type='workflow'

      - name: Upsert Cloudflare CNAME
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set; skipping DNS upsert"
            exit 0
          fi

          zone_json=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?name=mamahoos.ir")
          zone_id=$(printf '%s' "${zone_json}" | jq -r '.result[0].id // empty')
          if [ -z "${zone_id}" ] || [ "${zone_id}" = "null" ]; then
            echo "Could not find Cloudflare zone mamahoos.ir"
            printf '%s\n' "${zone_json}"
            exit 1
          fi

          payload='{"type":"CNAME","name":"portfolio","content":"mamahoos.github.io","proxied":false,"ttl":1}'
          existing_json=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?type=CNAME&name=portfolio.mamahoos.ir")
          record_id=$(printf '%s' "${existing_json}" | jq -r '.result[0].id // empty')

          if [ -n "${record_id}" ] && [ "${record_id}" != "null" ]; then
            curl -sS --fail-with-body -X PUT \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "${payload}" \
              "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records/${record_id}"
          else
            curl -sS --fail-with-body -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "${payload}" \
              "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records"
          fi | jq '{success, errors, result: (.result | {id, name, type, content, proxied})}'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
